# goldfishstudy.app — statische site op /, Flutter-app op /app/.
#
# Dit is het binnenste van het server-blok: productie (nginx/goldfish, met de
# certbot-regels) en de lokale test (scripts/test-site-local.sh) sluiten
# allebei dit bestand in, zodat lokaal precies dezelfde regels getest worden.
# Op de server: /etc/nginx/snippets/goldfish-site.conf.
#
#   /var/www/goldfish-site/        ← site/ (handgeschreven HTML)
#   /var/www/goldfish-site/app/    ← build/web/ van de Flutter-app (--base-href /app/)

root /var/www/goldfish-site;
index index.html;

# Compressie. application/wasm zit standaard niet in gzip_types; gzip zelf staat
# op de server al aan in nginx.conf, maar hier expliciet zodat het niet afhangt
# van wat daar staat.
gzip on;
gzip_types text/css application/javascript application/wasm image/svg+xml application/json;
gzip_min_length 1024;

# ── De app ───────────────────────────────────────────────────────────────────
# De router zit client-side: elk onbekend pad eronder krijgt de index.
location /app/ {
    try_files $uri $uri/ /app/index.html;
}
location = /app { return 301 /app/; }

# De index van de app nooit uit de cache: daar staat de verwijzing naar de
# nieuwe build in. main.dart.js heeft geen hash in zijn naam, dus die ook.
location = /app/index.html {
    add_header Cache-Control "no-cache";
}
location = /app/main.dart.js {
    add_header Cache-Control "no-cache";
}

# Oude deeplinks van vóór de verhuizing: alle topniveau-routes van de app
# (app_router.dart, app_tab.dart). Blijven permanent staan — bookmarks, gedeelde
# links en geïnstalleerde PWA's gebruiken ze nog.
location ~ ^/(decks|exams|library|groups|contacts|deck|exam|group|review|login)(/|$) {
    return 301 /app$request_uri;
}

# ── De statische site ────────────────────────────────────────────────────────
# Een echte 404 in plaats van de app als fallback.
location / {
    try_files $uri $uri.html $uri/ =404;
}
location ~ \.html$ {
    add_header Cache-Control "no-cache";
}
error_page 404 /404.html;
